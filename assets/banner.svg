    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#869bc1" stroke-opacity=".09"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#background)"/>
  <rect x="665" width="615" height="360" rx="20" fill="url(#grid)"/>
  <path d="M835 360V271H923V183H1011V95H1143V0" fill="none" stroke="#7585b6" stroke-width="42" stroke-opacity=".05"/>
