<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">miked06</title>
  <desc id="desc">Game automation, pathfinding and developer tools. A cyan and violet route crosses a dark geometric grid.</desc>
