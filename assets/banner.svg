  <g fill="#101a2e" stroke="#68dcd8" stroke-width="3">
    <circle cx="835" cy="271" r="6"/>
    <circle cx="923" cy="183" r="6"/>
  </g>
  <circle cx="1011" cy="95" r="6" fill="#101a2e" stroke="#a296ff" stroke-width="3"/>
  <circle cx="1211" cy="51" r="16" fill="#a296ff" fill-opacity=".12"/>
  <circle cx="1211" cy="51" r="6" fill="#b5adff"/>
